name: Update sssom context
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"
jobs:
  update_context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        
      - name: Work around permission issue
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Update sssom context
        run: |
          make deploy-dm -B

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@18f7dc018cc2cd597073088f7c7591b9d1c02672 # v3.14.0
        if: ${{ success() }}
        with:
          commit-message: Update SSSOM Extended Prefix Map
          title: 'Update SSSOM Extended Prefix Map'
          body: |
            This pull request updates the sssom extended prefix map (epm).

            **Important:** Wait for QC checks to pass before merging. The EPM update may change the number of resolved mappings, which can cause `test_parse_obographs` to fail. If so, update the expected count in `tests/test_parsers.py`.
          assignees: matentzn
